name: PR verification (no deployment)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://project.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_test
      - run: npm run validate:production-env && npm run build
        env:
          VITE_BASE_PATH: /M-F-FOOD/
          VITE_SUPABASE_URL: https://project.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_test
      - run: npm audit --audit-level=moderate
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/paymob-create-intention/index.ts supabase/functions/paymob-webhook/index.ts
      - run: deno test supabase/tests/intention-pause.test.ts
